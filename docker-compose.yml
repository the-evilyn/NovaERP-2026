version: '3.8'

services:
  # =============================================================================
  # PostgreSQL 16 Enterprise Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: novaerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novaerp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novaerp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - novaerp-network

  # =============================================================================
  # pgAdmin 4 Database Administration Web UI
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novaerp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@novaerp.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novaerp-network

  # =============================================================================
  # NovaERP Spring Boot 4 Backend Core Service
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novaerp-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: novaerp_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novaerp-network

networks:
  novaerp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
